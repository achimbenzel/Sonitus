# ============================================================
# electron-builder configuration — Windows / macOS / Linux.
#
# TODO before a real release:
#   - appId: change to your own reverse-DNS id
#   - icon:  add build/icon.icns (mac), build/icon.ico (win) and
#            build/icon.png (linux, 512x512), then uncomment the
#            icon lines below
#   - macOS code signing / notarization: set the CSC_LINK /
#     CSC_KEY_PASSWORD env vars and add
#       notarize: true
#     under `mac:` together with your Apple ID credentials
#     (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD env vars).
#   - Windows signing: set certificateFile/certificatePassword or
#     use signtool env configuration.
# ============================================================

appId: com.sonitus.ditherstudio   # TODO: replace with your app id
productName: Sonitus Dither Studio

directories:
  output: release

# Only ship the built web app and the Electron entry files.
files:
  - dist/**
  - electron/main.cjs
  - electron/preload.cjs
  - package.json

# The app is fully offline — never auto-download anything at runtime.
npmRebuild: false

mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
  # icon: build/icon.icns   # TODO: add a real .icns (current icons are
  #                           placeholders generated from the logo SVG)

win:
  target:
    - nsis
  # Placeholder icon generated from the logo SVG — replace build/icon.ico
  # with the final .ico (keep the filename).
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Graphics
  target:
    - AppImage
    - deb
  # Placeholder icon generated from the logo SVG — replace build/icon.png
  # with the final 512x512 png (keep the filename).
  icon: build/icon.png
